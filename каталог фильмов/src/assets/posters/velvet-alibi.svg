<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160c08"/>
      <stop offset="52%" stop-color="#2b150e"/>
      <stop offset="100%" stop-color="#0d090a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="noirFade" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#120908" stop-opacity="0"/>
        <stop offset="45%" stop-color="#0d0707" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#080505"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="600" height="900" fill="url(#bg)"/>
    
      <circle cx="300" cy="340" r="210" fill="#eab308" opacity="0.14" filter="url(#softGlow)"/>
      <g opacity="0.22" fill="#fde68a">
        <rect x="0" y="90" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="134" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="178" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="222" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="266" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="310" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="354" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="398" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="442" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="486" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="530" width="600" height="14" transform="skewY(-6)"/><rect x="0" y="574" width="600" height="14" transform="skewY(-6)"/>
      </g>
      <circle cx="300" cy="360" r="130" fill="none" stroke="#eab308" stroke-width="2" opacity="0.65"/>
      <circle cx="300" cy="360" r="102" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.35"/>
      <g transform="translate(120 535)">
        <rect x="0" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="40" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="80" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="120" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="160" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="200" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="240" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="280" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/><rect x="320" y="0" width="36" height="175" rx="3" fill="#f5e6c8" opacity="0.9"/>
        <rect x="25" y="0" width="24" height="108" rx="2" fill="#120908"/><rect x="65" y="0" width="24" height="108" rx="2" fill="#120908"/><rect x="145" y="0" width="24" height="108" rx="2" fill="#120908"/><rect x="185" y="0" width="24" height="108" rx="2" fill="#120908"/><rect x="225" y="0" width="24" height="108" rx="2" fill="#120908"/><rect x="305" y="0" width="24" height="108" rx="2" fill="#120908"/>
      </g>
      <rect x="0" y="695" width="600" height="205" fill="url(#noirFade)"/>
    
    <rect width="600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
