<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0b06"/>
      <stop offset="52%" stop-color="#5c1d0c"/>
      <stop offset="100%" stop-color="#180908"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="desertSun" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fde047"/>
        <stop offset="55%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#9a3412" stop-opacity="0.2"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="600" height="900" fill="url(#bg)"/>
    
      <circle cx="300" cy="390" r="155" fill="url(#desertSun)"/>
      <path d="M0 470 L120 390 L215 445 L335 375 L465 440 L600 385 L600 900 L0 900 Z" fill="#2c0f0a"/>
      <path d="M0 570 L180 520 L360 565 L600 515 L600 900 L0 900 Z" fill="#170705"/>
      <polygon points="270,580 330,580 460,900 140,900" fill="#0d0504"/>
      <line x1="300" y1="585" x2="300" y2="900" stroke="#fb923c" stroke-width="3" stroke-dasharray="18 22" opacity="0.75"/>
      <circle cx="282" cy="605" r="7" fill="#fef08a" filter="url(#glow)"/>
      <circle cx="318" cy="605" r="7" fill="#fef08a" filter="url(#glow)"/>
    
    <rect width="600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
