<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101c"/>
      <stop offset="52%" stop-color="#162840"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="celloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="50%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    
      <circle cx="1060" cy="430" r="280" fill="#60a5fa" opacity="0.16" filter="url(#softGlow)"/>
      <g fill="none" stroke="#93c5fd" opacity="0.3">
        <path d="M0 320 Q400 220 800 320 T1600 320" stroke-width="2.5"/>
        <path d="M0 400 Q400 300 800 400 T1600 400" stroke-width="2"/>
        <path d="M0 480 Q400 380 800 480 T1600 480" stroke-width="2.5"/>
      </g>
      <g transform="translate(760 40)">
        <path d="M300 205 C245 205 228 268 258 320 C275 348 258 378 232 415 C195 468 212 585 300 585 C388 585 405 468 368 415 C342 378 325 348 342 320 C372 268 355 205 300 205 Z" fill="url(#celloGrad)" opacity="0.88"/>
      </g>
    
    <rect width="1600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
