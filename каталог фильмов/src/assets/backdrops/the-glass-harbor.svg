<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041118"/>
      <stop offset="52%" stop-color="#0c2734"/>
      <stop offset="100%" stop-color="#08151e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="beam" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="beamLeft" x1="100%" y1="50%" x2="0%" y2="50%">
        <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0b2836"/>
        <stop offset="100%" stop-color="#02090f"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    
      <polygon points="1080,280 1600,120 1600,440" fill="url(#beam)" opacity="0.55"/>
      <polygon points="1080,280 280,140 280,430" fill="url(#beamLeft)" opacity="0.4"/>
      <path d="M1062 292 L1098 292 L1118 620 L1042 620 Z" fill="#071822"/>
      <circle cx="1080" cy="280" r="14" fill="#fef08a" filter="url(#glow)"/>
      <path d="M0 600 Q450 560 950 610 T1600 595 L1600 900 L0 900 Z" fill="url(#seaGrad)"/>
      <path d="M520 620 L740 620 L705 655 L555 655 Z" fill="#020a10"/>
    
    <rect width="1600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
