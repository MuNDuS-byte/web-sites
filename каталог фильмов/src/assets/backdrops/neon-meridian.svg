<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090418"/>
      <stop offset="52%" stop-color="#1b0b34"/>
      <stop offset="100%" stop-color="#081b2e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="neonSun" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f472b6"/>
        <stop offset="55%" stop-color="#ec4899"/>
        <stop offset="100%" stop-color="#3b0764" stop-opacity="0.1"/>
      </linearGradient>
      <linearGradient id="wetStreet" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0b081a" stop-opacity="0.9"/>
        <stop offset="40%" stop-color="#1e1136" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#05040d"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    
      <circle cx="1050" cy="340" r="240" fill="#ec4899" opacity="0.2" filter="url(#softGlow)"/>
      <circle cx="620" cy="520" r="260" fill="#06b6d4" opacity="0.14" filter="url(#softGlow)"/>
      <circle cx="1050" cy="320" r="130" fill="url(#neonSun)" opacity="0.85"/>
      <g fill="#080614">
        <rect x="80" y="380" width="110" height="520"/>
        <rect x="220" y="300" width="130" height="600"/>
        <rect x="380" y="420" width="115" height="480"/>
        <rect x="530" y="270" width="145" height="630"/>
        <rect x="710" y="350" width="120" height="550"/>
        <rect x="870" y="250" width="140" height="650"/>
        <rect x="1040" y="320" width="130" height="580"/>
        <rect x="1200" y="290" width="145" height="610"/>
        <rect x="1380" y="390" width="130" height="510"/>
      </g>
      <g stroke="#22d3ee" stroke-width="3" opacity="0.8" filter="url(#glow)">
        <line x1="560" y1="310" x2="560" y2="620"/>
        <line x1="905" y1="295" x2="905" y2="650"/>
        <line x1="1245" y1="340" x2="1245" y2="620"/>
      </g>
      <rect x="0" y="680" width="1600" height="220" fill="url(#wetStreet)"/>
    
    <rect width="1600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
