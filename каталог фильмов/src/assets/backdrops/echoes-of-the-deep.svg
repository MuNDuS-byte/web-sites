<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020914"/>
      <stop offset="52%" stop-color="#051d33"/>
      <stop offset="100%" stop-color="#010710"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="subBeam" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    
      <g fill="none" stroke="#22d3ee" opacity="0.5">
        <circle cx="1020" cy="480" r="80" stroke-width="3"/>
        <circle cx="1020" cy="480" r="170" stroke-width="2" opacity="0.65"/>
        <circle cx="1020" cy="480" r="275" stroke-width="1.5" opacity="0.38"/>
        <circle cx="1020" cy="480" r="390" stroke-width="1" opacity="0.2"/>
      </g>
      <polygon points="1020,240 810,720 1230,720" fill="url(#subBeam)" opacity="0.38"/>
      <ellipse cx="1020" cy="220" rx="58" ry="24" fill="#0f2940" stroke="#67e8f9" stroke-width="2"/>
    
    <rect width="1600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
