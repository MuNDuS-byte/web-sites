<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06140e"/>
      <stop offset="52%" stop-color="#102b1d"/>
      <stop offset="100%" stop-color="#0b1811"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="sunbeam" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fde68a" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="600" height="900" fill="url(#bg)"/>
    
      <polygon points="280,0 420,0 240,900 100,900" fill="url(#sunbeam)" opacity="0.35"/>
      <polygon points="410,0 530,0 380,900 280,900" fill="url(#sunbeam)" opacity="0.22"/>
      <circle cx="300" cy="470" r="160" fill="#f59e0b" opacity="0.18" filter="url(#softGlow)"/>
      <g fill="#05110b">
        <rect x="35" y="0" width="44" height="900"/>
        <rect x="120" y="0" width="24" height="900" opacity="0.8"/>
        <rect x="450" y="0" width="30" height="900" opacity="0.85"/>
        <rect x="520" y="0" width="52" height="900"/>
      </g>
      <g transform="translate(300 570)" fill="#030a07">
        <ellipse cx="0" cy="20" rx="48" ry="22"/>
        <rect x="-32" y="25" width="9" height="72"/>
        <rect x="-12" y="28" width="9" height="69"/>
        <rect x="14" y="28" width="9" height="69"/>
        <rect x="28" y="25" width="9" height="72"/>
        <path d="M22 10 L36 -32 L52 -24 L36 16 Z"/>
        <path d="M40 -30 L28 -68 M40 -30 L58 -66 M34 -48 L18 -56 M48 -46 L66 -52" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
      </g>
      <path d="M0 660 Q300 635 600 665 L600 900 L0 900 Z" fill="#030a07"/>
    
    <rect width="600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
