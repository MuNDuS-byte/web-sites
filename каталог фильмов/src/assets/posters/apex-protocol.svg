<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d17"/>
      <stop offset="52%" stop-color="#0f1f36"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
  </defs>
  <g filter="url(#grain)">
    <rect width="600" height="900" fill="url(#bg)"/>
    
      <polygon points="0,580 220,280 390,460 510,330 600,480 600,900 0,900" fill="#0b1526"/>
      <polygon points="0,680 180,460 350,600 600,430 600,900 0,900" fill="#060c16"/>
      <line x1="0" y1="535" x2="600" y2="535" stroke="#334155" stroke-width="8"/>
      <g fill="#060c16">
        <path d="M60 540 L60 760 L100 760 L100 540 Z"/>
        <path d="M240 540 L240 760 L280 760 L280 540 Z"/>
        <path d="M420 540 L420 760 L460 760 L460 540 Z"/>
      </g>
      <line x1="0" y1="528" x2="600" y2="528" stroke="#ef4444" stroke-width="4" filter="url(#glow)"/>
      <line x1="120" y1="180" x2="520" y2="528" stroke="#ef4444" stroke-width="2" opacity="0.65"/>
      <circle cx="480" cy="240" r="78" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.35"/>
      <circle cx="480" cy="240" r="42" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
      <line x1="480" y1="180" x2="480" y2="300" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
      <line x1="420" y1="240" x2="540" y2="240" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
    
    <rect width="600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
