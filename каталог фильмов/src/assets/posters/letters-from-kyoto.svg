<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190b0f"/>
      <stop offset="52%" stop-color="#34131c"/>
      <stop offset="100%" stop-color="#140c10"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="kyotoMoon" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff1f2"/>
        <stop offset="100%" stop-color="#fda4af" stop-opacity="0.7"/>
      </linearGradient>
      <linearGradient id="lantern" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#f97316"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="600" height="900" fill="url(#bg)"/>
    
      <circle cx="300" cy="340" r="170" fill="#fb7185" opacity="0.16" filter="url(#softGlow)"/>
      <circle cx="300" cy="315" r="110" fill="url(#kyotoMoon)" opacity="0.92"/>
      <path d="M60 445 Q300 410 540 445 L515 470 Q300 442 85 470 Z" fill="#13080b"/>
      <rect x="135" y="468" width="18" height="230" fill="#16090d"/>
      <rect x="447" y="468" width="18" height="230" fill="#16090d"/>
      <rect x="276" y="475" width="48" height="72" rx="14" fill="url(#lantern)" filter="url(#glow)"/>
      <line x1="300" y1="452" x2="300" y2="475" stroke="#fde68a" stroke-width="2"/>
      <g fill="#f43f5e" opacity="0.82">
        <ellipse cx="145" cy="210" rx="12" ry="6" transform="rotate(-35 145 210)"/>
        <ellipse cx="430" cy="250" rx="14" ry="7" transform="rotate(25 430 250)"/>
        <ellipse cx="215" cy="610" rx="11" ry="5" transform="rotate(-20 215 610)"/>
        <ellipse cx="395" cy="585" rx="13" ry="6" transform="rotate(40 395 585)"/>
        <ellipse cx="480" cy="360" rx="10" ry="5" transform="rotate(-45 480 360)"/>
      </g>
      <rect x="0" y="695" width="600" height="205" fill="#0d0608"/>
    
    <rect width="600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
