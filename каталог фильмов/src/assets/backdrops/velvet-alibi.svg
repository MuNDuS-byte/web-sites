<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160c08"/>
      <stop offset="52%" stop-color="#2b150e"/>
      <stop offset="100%" stop-color="#0d090a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="noirFade" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#120908" stop-opacity="0"/>
        <stop offset="45%" stop-color="#0d0707" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#080505"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    
      <circle cx="1060" cy="400" r="280" fill="#eab308" opacity="0.15" filter="url(#softGlow)"/>
      <g opacity="0.16" fill="#fde68a">
        <rect x="0" y="40" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="96" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="152" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="208" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="264" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="320" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="376" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="432" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="488" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="544" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="600" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="656" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="712" width="1600" height="18" transform="skewY(-5)"/><rect x="0" y="768" width="1600" height="18" transform="skewY(-5)"/>
      </g>
      <g transform="translate(760 540)" opacity="0.75">
        <rect x="0" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="48" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="96" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="144" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="192" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="240" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="288" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="336" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="384" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="432" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="480" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="528" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="576" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/><rect x="624" y="0" width="43" height="220" rx="4" fill="#f5e6c8"/>
        <rect x="30" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="78" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="174" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="222" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="270" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="366" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="414" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="510" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="558" y="0" width="28" height="135" rx="3" fill="#120908"/><rect x="606" y="0" width="28" height="135" rx="3" fill="#120908"/>
      </g>
    
    <rect width="1600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
