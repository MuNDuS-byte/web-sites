<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c0b"/>
      <stop offset="52%" stop-color="#131d1b"/>
      <stop offset="100%" stop-color="#070a0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
      <linearGradient id="emeraldDoor" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#a7f3d0"/>
        <stop offset="45%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#064e3b"/>
      </linearGradient>
      <linearGradient id="doorLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </linearGradient>
    
  </defs>
  <g filter="url(#grain)">
    <rect width="600" height="900" fill="url(#bg)"/>
    
      <rect x="90" y="130" width="420" height="580" fill="#101816" stroke="#1f2f2b" stroke-width="2"/>
      <rect x="145" y="185" width="310" height="470" fill="#0c1312" stroke="#223530" stroke-width="2"/>
      <rect x="205" y="245" width="190" height="350" fill="#080e0d" stroke="#263d37" stroke-width="2"/>
      <rect x="255" y="305" width="90" height="230" fill="url(#emeraldDoor)" filter="url(#glow)"/>
      <polygon points="255,535 345,535 450,760 150,760" fill="url(#doorLight)" opacity="0.5"/>
      <g fill="#060908" opacity="0.85">
        <rect x="90" y="610" width="420" height="16"/>
        <rect x="90" y="642" width="420" height="18"/>
        <rect x="90" y="678" width="420" height="22"/>
      </g>
    
    <rect width="600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
