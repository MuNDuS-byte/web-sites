<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a09"/>
      <stop offset="52%" stop-color="#0f1c18"/>
      <stop offset="100%" stop-color="#050808"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="linear" slope="0.06"/>
    </feComponentTransfer>
    <feBlend mode="overlay" in="SourceGraphic" in2="soft"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>

    
  </defs>
  <g filter="url(#grain)">
    <rect width="600" height="900" fill="url(#bg)"/>
    
      <circle cx="300" cy="310" r="190" fill="#22c55e" opacity="0.14" filter="url(#softGlow)"/>
      <g fill="none" stroke="#4ade80" opacity="0.45">
        <circle cx="300" cy="255" r="46" stroke-width="2"/>
        <circle cx="300" cy="255" r="95" stroke-width="1.5" opacity="0.65"/>
        <circle cx="300" cy="255" r="150" stroke-width="1.2" opacity="0.35"/>
      </g>
      <path d="M296 255 L304 255 L345 640 L255 640 Z" fill="none" stroke="#334155" stroke-width="3"/>
      <line x1="274" y1="450" x2="326" y2="450" stroke="#334155" stroke-width="2"/>
      <line x1="264" y1="540" x2="336" y2="540" stroke="#334155" stroke-width="2"/>
      <circle cx="300" cy="255" r="8" fill="#4ade80" filter="url(#glow)"/>
      <path d="M0 590 L110 590 L145 590 L175 515 L205 655 L235 480 L268 670 L300 430 L332 660 L362 505 L395 635 L425 565 L455 590 L600 590" fill="none" stroke="#4ade80" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    
    <rect width="600" height="900" fill="url(#vignette)"/>
  </g>
</svg>
